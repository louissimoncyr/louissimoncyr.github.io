name: Refresh arXiv tracker data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh math.SG counts
        run: python scripts/update_symplectic_stats.py

      - name: Commit refreshed data when it changed
        run: |
          if git diff --quiet -- data/papers.csv data/weekly_counts.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.csv data/weekly_counts.json
          git commit -m "Refresh arXiv tracker data"
          git push
